<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <header>
        <h1>Clothing Calculator</h1>
    </header>
    <div class="gridContainer">
        <div class="inputCard box">
            <p>Activity Level</p>
            <div class="activityBtns">
                <button id="walkBtn" onclick="setActivity('low')"><i class="fi fi-br-walking"></i></button>
                <button id="jogBtn" onclick="setActivity('medium')"><i class="fi fi-br-running"></i></button>
                <button id="runBtn" onclick="setActivity('high')"><i class="fi fi-br-user-fast-running"></i></button>
            </div>
            <label for="tempSensitivity">Temperature Sensitivity</label>
            <span id="sliderValueDisplay">Average</span>
            <input 
                type="range" 
                id="tempSensitivity" 
                name="tempSensitivity" 
                min="1" 
                max="5" 
                value="3" 
                step="1" 
                class="slider"
                oninput="updateSlider(this)"
            >
            <div class="locationSelection">
                <input type="text" class="cityInput" placeholder="Search for a city...">
                <button onclick="getGeolocation()"><i class="fi fi-rr-marker"></i></button>
            </div>
            <p class="errorDisplay"></p>
            <button onclick="calculateClothing()" class="calcBtn">Calculate</button>
        </div>

        <div class="clothingCard box">
            
        </div>

        <div class="descCard box">
            <p class="descDisplay"></p>
            <br>
            <hr>
            <br>
            <div class="weatherDisplay"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
