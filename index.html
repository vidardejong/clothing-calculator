<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <header>
        <h1>Clothing Calculator</h1>
    </header>
    <main>
        <div class="inputCard card">
            <p>Activity Level</p>
            <div class="activityBtns">
                <button id="restBtn" onclick="setActivity('low')"><i class="fi fi-sr-person-simple"></i></button>
                <button id="walkBtn" onclick="setActivity('medium')"><i class="fi fi-sr-walking"></i></button>
                <button id="runBtn" onclick="setActivity('high')"><i class="fi fi-sr-running"></i></button>
            </div>
            <label for="tempSensitivity">Temperature Sensitivity</label>
            <span id="sliderValueDisplay">Average</span>
            <input 
                type="range" 
                id="tempSensitivity" 
                name="tempSensitivity" 
                min="1" 
                max="5" 
                value="3" 
                step="1" 
                class="slider"
                oninput="updateSlider(this)"
            >
            <div class="locationSelection">
                <input type="text" class="cityInput" placeholder="Enter a location...">
                <button onclick="getGeolocation()"><i class="fi fi-rr-marker"></i></button>
            </div>
            <p class="errorDisplay"></p>
            <button onclick="calculateClothing()" class="calcBtn">Calculate</button>
        </div>

        <div class="outfitCard card">
            <h2>Recommended Outfit</h2>
            <img id="outfitImg">
        </div>

        <div class="descCard card">
            <h2>Recommended Clothes</h2>
            <div class="clothesContainer"></div>
            <br>
            <hr>
            <br>
            <div class="weatherInfo"></div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
